<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up · JobPortal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">

  <script src="/js/signup.js" defer></script>
</head>
<body>
  <div class="brand-panel">
    <div class="brand-logo">JOBPORTAL</div>
    <p class="brand-tagline">Alătură-te unei platforme moderne pentru candidați și companii tech.</p>
  </div>

  <div class="form-panel">
  <section>

    <form action="/req/signup" method="post" autocomplete="off">
      <h1>Sign Up</h1>
      <p>Completează datele pentru a-ți crea profilul</p>

      <div class="inputbox">
        <input type="text" id="username" name="username" autocomplete="off" required>
        <label for="username">Name</label>
      </div>
      <div class="inputbox">
        <input type="email" id="email" name="email" autocomplete="off" required>
        <label for="email">Email</label>
      </div>

      <div class="inputbox">
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <label for="password">Password</label>
      </div>
      <div class="inputbox">
        <input type="password" id="passwordcon" name="passwordcon" autocomplete="new-password" required>
        <label for="passwordcon">Confirm Password</label>
      </div>
      <button id="submit" type="submit">Sign Up</button>
      <div class="register">
        <p>Already have an account?<a href="/req/login"> Login</a></p>
      </div>
    </form>
  </section>
  </div>
</body>
</html>
<script>
  const submitButttom = document.getElementById("submit");
  submitButttom.addEventListener('click',()=>{
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('passwordcon').value;
    const email = document.getElementById('email').value;
    const data ={
      username,
      email,
      password
    }

    if(password == confirmPassword){
      const jsonData = JSON.stringify(data);
      fetch('/req/signup', {
        method: 'POST',
        headers:{
          'Content-Type': 'application/json'
        },
        body: jsonData
      })
      .then(response =>{
        //alert('succesfull');
        //if(response.status == 200){
          //alert('succesfull');
        //xs}
      })
    }

  })


</script>
