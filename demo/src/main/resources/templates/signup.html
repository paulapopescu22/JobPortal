<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up · JobPortal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">

  <script src="/js/signup.js" defer></script>
</head>
<body>
  <div class="auth-layout">
  <div class="brand-panel">
    <div class="brand-logo">JOBPORTAL</div>
  </div>

  <div class="form-panel">
  <section>

    <form action="/req/signup" method="post" autocomplete="off">
      <h1>Sign Up</h1>

      <div class="role-toggle">
        <button type="button" class="role-btn active" id="roleCandidat" data-role="CANDIDAT">Candidate</button>
        <button type="button" class="role-btn" id="roleCompanie" data-role="COMPANIE">Company</button>
      </div>
      <input type="hidden" id="role" name="role" value="CANDIDAT">

      <div class="inputbox">
        <input type="text" id="username" name="username" autocomplete="off" required>
        <label for="username">Name</label>
      </div>
      <div class="inputbox">
        <input type="email" id="email" name="email" autocomplete="off" required>
        <label for="email">Email</label>
      </div>

      <div class="inputbox">
        <input type="password" id="password" name="password" autocomplete="new-password" required>
        <label for="password">Password</label>
      </div>
      <div class="inputbox">
        <input type="password" id="passwordcon" name="passwordcon" autocomplete="new-password" required>
        <label for="passwordcon">Confirm Password</label>
      </div>
      <button id="submit" type="submit">Sign Up</button>
      <div class="register">
        <p>Already have an account?<a href="/req/login"> Login</a></p>
      </div>
    </form>
  </section>
  </div>
  </div>

  <footer class="site-footer">
  <div class="footer-brand">JOBPORTAL</div>
  <div class="footer-tagline">a platform built for candidates &amp; tech companies</div>
  <div class="footer-links">
  <a href="/terms">Terms &amp; Conditions</a>
  <a href="/privacy">Privacy Policy</a>
  <a href="/homePage">Home</a>
  <a href="/viewAllJobs">Jobs</a>
  </div>
  <div class="footer-copy">&copy; 2026 JobPortal. All rights reserved.</div>
  </footer>
</body>
</html>
<script>
  document.querySelectorAll('.role-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.role-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('role').value = btn.getAttribute('data-role');
    });
  });

  const submitButttom = document.getElementById("submit");
  submitButttom.addEventListener('click',()=>{
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('passwordcon').value;
    const email = document.getElementById('email').value;
    const role = document.getElementById('role').value;
    const data ={
      username,
      email,
      password,
      role
    }

    if(password == confirmPassword){
      const jsonData = JSON.stringify(data);
      fetch('/req/signup', {
        method: 'POST',
        headers:{
          'Content-Type': 'application/json'
        },
        body: jsonData
      })
      .then(response =>{
        //alert('succesfull');
        //if(response.status == 200){
          //alert('succesfull');
        //xs}
      })
    }

  })


</script>
