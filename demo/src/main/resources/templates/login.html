<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · JobPortal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">

  <script src="/js/signup.js" defer></script>
</head>
<body>
  <div class="auth-layout">
  <div class="brand-panel">
    <div class="brand-logo">JOBPORTAL</div>
  </div>

  <div class="form-panel">
  <section>

    <form action="/req/login" method="post" autocomplete="off">
      <h1>Login</h1>

      <div class="dialog-row">
        <label th:if="${param.error}" th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}" class="redText"></label>
      </div>

      <div class="inputbox">
        <input name="username" id="username" type="text" autocomplete="off" required>
        <label for="username">username</label>
      </div>
      <div class="inputbox">
        <input name="password" type="password" id="password" autocomplete="new-password" required>
        <label for="password">Password</label>
      </div>
      <div class="register">
        <p><a href="#">Forget Password ?</a></p>
      </div>
      <button type="submit">Log in</button>
      <div class="register">
        <p>Don't have a account ?<a href="/req/signup"> Register!!</a></p>
      </div>
    </form>
  </section>
  </div>
  </div>

  <footer class="site-footer">
  <div class="footer-brand">JOBPORTAL</div>
  <div class="footer-tagline">a platform built for candidates &amp; tech companies</div>
  <div class="footer-links">
  <a href="/terms">Terms &amp; Conditions</a>
  <a href="/privacy">Privacy Policy</a>
  <a href="/homePage">Home</a>
  <a href="/viewAllJobs">Jobs</a>
  </div>
  <div class="footer-copy">&copy; 2026 JobPortal. All rights reserved.</div>
  </footer>
</body>
</html>
